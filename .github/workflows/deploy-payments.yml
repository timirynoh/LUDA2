# Installs/updates the Luda payment server on Supabase whenever supabase/** changes
# (or when run by hand from the GitHub "Actions" tab).
# Needs three GitHub repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   – the "abcd" in https://abcd.supabase.co
#   SUPABASE_DB_PASSWORD   – the database password chosen when creating the project
# Payment keys (Paystack/Flutterwave) are NOT stored here: they live in Supabase → Edge Functions → Secrets.
name: Deploy payment server

on:
  workflow_dispatch:
  push:
    branches: [main, claude/cyprus-expat-app-mlnvuc]
    paths: ['supabase/**', '.github/workflows/deploy-payments.yml']

concurrency: deploy-payments

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Money tests (real Postgres, fake providers)
        working-directory: supabase
        run: npm ci && npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are set
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Add the GitHub secret $v (see docs/GO_LIVE.md)"; exit 1; fi
          done
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Create / update database tables
        run: |
          # Newer Supabase CLIs read the password from SUPABASE_DB_PASSWORD and need --remote and --yes (CI cannot answer the prompt).
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy payment functions
        # No Supabase JWT gate: "api" checks the user token itself (public routes are
        # rate-limited) and pay-webhook is protected by the provider signature.
        run: |
          for fn in api pay-webhook; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          done
      - name: Print your webhook address
        run: echo "Webhook URL for Paystack and Flutterwave → https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/pay-webhook"
      # v1.24.0 (owner's pick): after every release, call the live server like a phone would. If anything is broken the
      # deploy turns red, so the owner hears about it before users do. Read-only: public routes only, nothing is changed.
      - name: Check the live server works
        run: |
          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/api"
          check() { # name, path, jq test
            for i in 1 2 3 4 5; do
              body=$(curl -sS --max-time 20 -H "origin: https://luda-ct6.pages.dev" "$base/$2" || true)
              if echo "$body" | jq -e "$3" > /dev/null 2>&1; then echo "✅ $1"; return 0; fi
              sleep 10
            done
            echo "::error::Live check failed: $1 → $(echo "$body" | head -c 300)"; return 1
          }
          fail=0
          check "Server config (payments, ID checks)" config '.providers | length > 0' || fail=1
          check "Exchange rate" rate '.ngnPerTry > 0' || fail=1
          check "Home banners" banners '.banners | type == "array"' || fail=1
          check "Help Center articles" help '.topics | length > 0' || fail=1
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/me")
          if [ "$code" = "401" ]; then echo "✅ Signed-in pages need a session"; else echo "::error::GET me without a session returned $code (expected 401)"; fail=1; fi
          # GET only: a POST without a signature would be logged as a rejected webhook and set off the health alarm.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/pay-webhook")
          if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then echo "✅ Webhook address answers ($code)"; else echo "::error::Webhook address returned $code"; fail=1; fi
          exit $fail
