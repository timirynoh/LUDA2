# Read-only health check (also runs when this file changes) of the live payment database (run by hand from the Actions tab).
# Prints the latest top-ups, their processing history and wallet totals, with no emails and shortened references.
name: Check payments (read-only)

on:
  workflow_dispatch:
  push:
    branches: [claude/cyprus-expat-app-mlnvuc]
    paths: ['.github/workflows/diagnose.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Query
        run: |
          q() {
            echo; echo "=== $1"
            jq -n --arg q "$2" '{query: $q}' | curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @- > /tmp/out.json || true
            jq -c '.[]? // .' /tmp/out.json 2>/dev/null || cat /tmp/out.json
            sleep 2 # stay under the Management API rate limit
          }
          echo; echo "=== Live server switches (public /api/config)"
          curl -sS "https://$REF.supabase.co/functions/v1/api/config" | jq -c '{providers, foreign, payouts, kyc, didit, nin, google, sms}' || true
          echo; echo "=== Secrets that are set (names only, values are never shown)"
          curl -sS "https://api.supabase.com/v1/projects/$REF/secrets" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.[].name' | sort | tr '\n' ' ' || true
          echo; sleep 2
          q "Latest top-ups" "select '…'||right(reference,8) as ref, provider, status, amount_minor/100.0 as charged, currency, credit_minor/100.0 as credit, credit_currency, created_at, paid_at from payments order by created_at desc limit 10"
          q "Processing history (latest 25 events)" "select '…'||right(reference,8) as ref, kind, at, left(coalesce(payload::text,''), 220) as detail from payment_events order by id desc limit 25"
          q "Latest withdrawals" "select '…'||right(reference,8) as ref, provider, status, amount_minor/100.0 as amount, fee_minor/100.0 as fee, bank_name, '••'||right(account_number,4) as acct, transfer_code, note, created_at, updated_at from withdrawals order by created_at desc limit 10"
          q "Withdrawal events (what Paystack / Flutterwave answered)" "select '…'||right(reference,8) as ref, kind, at, left(coalesce(payload::text,''), 300) as detail from payment_events where reference like 'wdr_%' or kind like 'withdraw%' order by id desc limit 30"
          echo; echo "################ PROBLEMS (empty lists = all good) ################"
          q "PROBLEM: top-ups under review (paid amount/currency did not match)" "select '…'||right(reference,8) as ref, provider, amount_minor/100.0 as expected, currency, created_at from payments where status = 'mismatch' order by created_at desc limit 20"
          q "PROBLEM: top-ups still pending after 1 hour (self-healing re-checks them when the user opens the app)" "select '…'||right(reference,8) as ref, provider, amount_minor/100.0 as amount, created_at from payments where status = 'pending' and created_at < now() - interval '1 hour' order by created_at desc limit 20"
          q "PROBLEM: withdrawals processing for over 30 minutes" "select '…'||right(reference,8) as ref, amount_minor/100.0 as amount, created_at from withdrawals where status = 'processing' and created_at < now() - interval '30 minutes'"
          q "PROBLEM: rejected webhooks in the last 7 days (wrong secret hash / key?)" "select payload->>'from' as provider, count(*) as rejected, max(at) as last from payment_events where kind = 'webhook_bad_signature' and at > now() - interval '7 days' group by 1"
          q "PROBLEM: wallets that don't match their ledger (should never happen)" "select '…'||right(w.user_id::text,6) as user_, w.currency, w.balance_minor, coalesce(l.s,0) as ledger_sum from wallets w left join (select user_id, currency, sum(amount_minor) s from ledger group by 1,2) l using (user_id, currency) where w.balance_minor <> coalesce(l.s,0)"
          echo; echo "################ HEALTH ################"
          q "Webhooks received in the last 7 days (0 = webhook URL not set or not reaching Luda)" "select coalesce(payload->>'provider','?') as provider, count(*) as received, max(at) as last from payment_events where kind = 'webhook' and at > now() - interval '7 days' group by 1"
          q "Latest Flash jobs (who can see them depends on city + status)" "select left(title,40) as title, city, status, reward_minor/100.0 as reward, luda_uname(poster) as poster, created_at from flash_jobs order by created_at desc limit 10"
          q "Latest community posts" "select kind, left(title,40) as title, city, status, official, reports, luda_uname(user_id) as author, created_at, expires_at from board_posts order by created_at desc limit 10"
          q "Groups" "select left(name,30) as name, status, (select count(*) from chat_members m where m.group_id=g.id) as members, (select count(*) from chat_messages c where c.group_id=g.id) as messages from chat_groups g order by created_at desc limit 10"
          q "Recent sign-in events (last 2 days)" "select kind, count(*) as n, max(at) as last from payment_events where at > now() - interval '2 days' and (kind like '%login%' or kind like '%password%' or kind like '%recover%' or kind like '%signup%') group by 1 order by 1"
          q "Wallet totals" "select currency, count(*) as wallets, sum(balance_minor)/100.0 as total from wallets group by currency"
          q "Accounts" "select count(*) as profiles, count(*) filter (where pin_hash is not null) as with_pin from profiles"
