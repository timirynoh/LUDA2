# Sends a real password-reset email through the live Luda server (same as tapping 'Forgot password'), to check that
# emails arrive from Luda <no-reply@useluda.com> with the branded template. Run it from the Actions tab.
name: Send a test password-reset email

on:
  workflow_dispatch:
    inputs:
      email:
        description: Email address of an existing Luda account
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      EMAIL: ${{ inputs.email }}
    steps:
      - name: Ask Luda to send a reset email
        run: |
          body=$(jq -n --arg e "$EMAIL" '{email: $e}')
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST "https://$REF.supabase.co/functions/v1/api/recover" \
            -H "origin: https://useluda.com" -H "content-type: application/json" --data "$body")
          echo "Luda answered HTTP $code: $(cat /tmp/r.json)"; [ "$code" = "200" ]
